<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ciclorrutas de Bogotá en 3D</title>
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <h1>Ciclorrutas de Bogotá</h1>
      <p id="status" role="status">Cargando…</p>

      <fieldset>
        <legend>Mapa base</legend>
        <label><input type="radio" name="basemap" value="gris" checked /> Gris</label>
        <label><input type="radio" name="basemap" value="hibrido" /> Satélite</label>
        <label><input type="radio" name="basemap" value="oscuro" /> Oscuro</label>
      </fieldset>

      <label class="row">
        <span>Exageración del relieve <output id="exaggeration-value">1.5×</output></span>
        <input id="exaggeration" type="range" min="1" max="4" step="0.5" value="1.5" />
      </label>

      <label><input id="toggle-ciclorrutas" type="checkbox" checked /> Ciclorrutas</label>
      <label><input id="toggle-hillshade" type="checkbox" checked /> Sombreado del relieve</label>

      <p class="hint">Arrastra con clic derecho (o Ctrl + arrastrar) para rotar e inclinar.</p>
    </aside>

    <section id="profile" hidden>
      <header>
        <div class="modes" role="group" aria-label="Color del perfil">
          <button type="button" data-mode="pendiente" aria-pressed="true">Pendiente</button>
          <button type="button" data-mode="tipo" aria-pressed="false">Tipo de vía</button>
        </div>
        <strong data-summary></strong>
        <div class="legend" data-legend></div>
        <button type="button" class="clear" data-clear>Borrar ruta</button>
      </header>
      <div class="chart">
        <canvas></canvas>
        <output data-tooltip hidden></output>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
