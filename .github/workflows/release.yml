name: Publicar versión

# Al subir un tag vX.Y.Z empaqueta la aplicación de escritorio para cada sistema y crea
# el release con los archivos. En las ramas release/* solo empaqueta y prueba, para
# detectar fallos antes de etiquetar.
on:
  push:
    tags: ['v*']
    branches: ['release/**']

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            run: release/win-unpacked/ciclorrutas-bogota.exe
          - os: macos-latest
            target: --mac
            run: release/mac-arm64/ciclorrutas-bogota.app/Contents/MacOS/ciclorrutas-bogota
          - os: ubuntu-latest
            target: --linux
            run: xvfb-run -a release/linux-unpacked/ciclorrutas-bogota --no-sandbox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Comprobar que la aplicación abre el visor
        shell: bash
        run: |
          ${{ matrix.run }} --remote-debugging-port=9333 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9333/json/list 2>/dev/null | grep -q 'app://ciclorrutas/'; then
              echo "La ventana cargó el visor."
              exit 0
            fi
            sleep 2
          done
          echo "La aplicación no abrió el visor." >&2
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  release:
    needs: app
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<'NOTAS'
          ## Aplicación de escritorio

          Descarga el archivo de tu sistema y ábrelo: el visor aparece en su propia ventana, sin instalar nada más. Necesita internet para el relieve y los mapas base de IDECA.

          | Sistema | Archivo | Cómo abrirlo |
          | --- | --- | --- |
          | Windows 64 bits | `…-win-x64.exe` | Doble clic. No se instala. |
          | macOS Apple Silicon (M1 o posterior) | `…-mac-arm64.dmg` | Abre el archivo y arrastra la app a Aplicaciones. |
          | macOS Intel | `…-mac-x64.dmg` | Igual que el anterior. |
          | Linux 64 bits | `…-linux-x86_64.AppImage` | Dale permiso de ejecución y ábrelo. |

          La aplicación no está firmada con un certificado de pago, así que el sistema pide confirmación la primera vez:

          - **Windows**: en el aviso azul de SmartScreen, «Más información» → «Ejecutar de todas formas».
          - **macOS**: si dice que no se puede abrir, ve a Ajustes del Sistema → Privacidad y seguridad y pulsa «Abrir de todos modos».

          También está en línea, sin descargar nada: https://diazrincon.github.io/bogota-ciclorutas/
          NOTAS
          gh release create "$GITHUB_REF_NAME" apps/* --title "$GITHUB_REF_NAME" --notes-file notas.md --generate-notes
